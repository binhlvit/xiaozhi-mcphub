version: "3.8"

volumes:
  appdata:

services:
  mcphub:
    image: huangjunsen/xiaozhi-mcphub:latest
    container_name: xiaozhi-mcphub
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Pre-existing Postgres — no `db` container here. The instance needs the
      # pgvector extension available (CREATE EXTENSION IF NOT EXISTS vector runs
      # automatically on startup, but the extension must already be installed on
      # the Postgres server itself). Setting DB_URL alone enables database mode.
      # Value comes from the .env file (untracked) next to this compose file.
      DB_URL: "${DB_URL}"
      NODE_ENV: production
      SMART_ROUTING_ENABLED: "false"
      # 生产建议开启：
      # JWT_SECRET: "请改成一串长随机值"
      # BASE_PATH: "/mcphub"   # 如需挂到子路径
      # OPENAI_API_KEY: "sk-..."
    volumes:
      - appdata:/app/data
